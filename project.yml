# XcodeGen spec — the single source of truth for the Xcode project.
# Generate with `xcodegen generate` (the .xcodeproj is gitignored). This lets the
# project be authored on any OS and compiled on a macOS runner / Mac.
name: AvangardVPN
options:
  bundleIdPrefix: com.avangard.vpn
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Signing is filled in locally / by CI (fastlane match). Simulator builds in CI
    # pass CODE_SIGNING_ALLOWED=NO, so no team is needed for the compile-check.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

# WireGuardKit (the tunnel engine) is added in P3 — it carries a wireguard-go build
# phase that needs Go on the build machine, so we wire it once the skeleton is green.
# packages:
#   WireGuardKit:
#     url: https://github.com/... (wireguard-apple mirror)
#     from: "1.0.15"

targets:
  # ── Main app ──────────────────────────────────────────────────────────────
  AvangardVPN:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Avangard VPN
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Lets DEBUG builds reach a backend running on the dev machine over
        # plain HTTP (see AppConfig.baseURL). This only relaxes ATS for
        # local/loopback addresses — connections to the production origin are
        # still held to full ATS requirements.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/AvangardVPN.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.avangard.vpn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avangard.vpn
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
    dependencies:
      - target: AvangardTunnel
        embed: true
    scheme:
      testTargets:
        - AvangardVPNTests
      # Forwarded into the test process. `$(VAR)` expands from build settings,
      # so `xcodebuild test AVANGARD_API_BASE=…` reaches the tests. (The
      # TEST_RUNNER_-prefix trick only works for UI-test runners, not for unit
      # tests hosted inside the app.)
      environmentVariables:
        AVANGARD_API_BASE: $(AVANGARD_API_BASE)
        AVANGARD_VERIFIED_SESSION_ID: $(AVANGARD_VERIFIED_SESSION_ID)
        AVANGARD_VERIFIED_SESSION_ID_2: $(AVANGARD_VERIFIED_SESSION_ID_2)
        AVANGARD_VERIFIED_SESSION_ID_3: $(AVANGARD_VERIFIED_SESSION_ID_3)

  # ── Tests ──────────────────────────────────────────────────────────────────
  # Integration tests that exercise the real API client against a backend run
  # locally (`pnpm dev` in fixidn/wireguard-dashboard). They skip themselves
  # when AVANGARD_API_BASE is unset, so CI's unsigned compile-check is unaffected.
  AvangardVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AvangardVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avangard.vpn.tests
        # Signing a test bundle needs an Info.plist; let Xcode synthesise one
        # rather than checking in a file that carries no real configuration.
        GENERATE_INFOPLIST_FILE: "YES"

  # ── Device-test build (free Apple ID) ──────────────────────────────────────
  # Same app sources, minus the two things a free "Personal Team" cannot sign:
  # the embedded tunnel extension (packet-tunnel-provider is paid-only) and the
  # App Groups entitlement (also paid-only). Nothing built so far uses either —
  # they belong to the tunnel, which arrives in P3 — so this runs the real app
  # on a real iPhone with no paid account.
  #
  #   xcodegen generate && open AvangardVPN.xcodeproj
  #   → scheme "AvangardVPNDeviceTest" → your Personal Team → Run
  #
  # The bundle id differs from production ON PURPOSE. App IDs are globally
  # unique across Apple Developer accounts, so letting a personal team claim
  # `com.avangard.vpn` risks blocking the real account from registering it
  # later. A throwaway test build is not worth that.
  AvangardVPNDeviceTest:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    info:
      path: App/DeviceTest-Info.plist
      properties:
        CFBundleDisplayName: Avangard Dev
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Lets a DEBUG build on-device talk to a backend running on the dev
        # machine over the LAN. Only relaxes ATS for local addresses.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avangard.vpn.devtest
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"

  # ── Packet Tunnel Provider (VPN runs here) ─────────────────────────────────
  AvangardTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel/Sources
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Avangard Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/AvangardTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.avangard.vpn
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avangard.vpn.network-extension
