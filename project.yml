# XcodeGen spec — the single source of truth for the Xcode project.
# Generate with `xcodegen generate` (the .xcodeproj is gitignored). This lets the
# project be authored on any OS and compiled on a macOS runner / Mac.
name: AvangardVPN
options:
  bundleIdPrefix: com.avangard.vpn
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    # "1.0", not "1.0.0" — this is the string the App Store shows, and the
    # version record in App Store Connect is 1.0. It sat unused at 1.0.0 while
    # XcodeGen wrote 1.0 into the plist on its own; wiring the plist to this
    # setting woke the mismatch up, and a build stamped 1.0.0 would hang off a
    # version that does not exist there.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Apple Developer Team for PT Stacopa Avangard Raya. Enrolment was paid on
    # 2026-09-02, which is what made signed device builds possible at all.
    #
    # Checked in on purpose. A Team ID is not a secret — it is embedded in every
    # provisioning profile and readable from any signed .ipa — and leaving it
    # blank has a real cost here: `xcodegen generate` rewrites the .xcodeproj,
    # so a team picked in Xcode's UI is wiped by the next generate. Whoever is
    # building would have to re-select it every single time, and the failure
    # when they forget is a signing error that reads like a certificate problem.
    #
    # CI still passes CODE_SIGNING_ALLOWED=NO for the unsigned compile-check, so
    # this changes nothing there.
    DEVELOPMENT_TEAM: 8HSUX5T86H
    CODE_SIGN_STYLE: Automatic

    # iPhone only. Xcode's default is "1,2", which App Store Connect rejects
    # for this app:
    #
    #   ITMS-90474: The "UIInterfaceOrientationPortrait" orientations were
    #   provided for the UISupportedInterfaceOrientations Info.plist key ...
    #   but you need to include all of the ...
    #
    # An iPad build must support all four orientations, and every screen here
    # is laid out portrait-only and has never been rendered landscape. Shipping
    # into that rule would mean claiming a layout nobody has looked at.
    #
    # The direction matters: adding iPad later is a normal release, while
    # dropping a device family after users have it is not. So this starts
    # narrow deliberately, not as a limitation to fix.
    #
    # Xcode warned about this from the first build ("All interface orientations
    # must be supported unless the app requires full screen") -- it was one
    # warning among thousands of log lines, and only App Store Connect made it
    # fatal.
    #
    # ⚠️ Setting it here is NOT enough, and the first attempt at this fix proved
    # it: XcodeGen writes TARGETED_DEVICE_FAMILY = "1,2" into every iOS target
    # itself, and a target-level setting beats a project-level one. The built
    # Info.plist still said UIDeviceFamily = (1, 2). It has to be repeated in
    # each shipping target's own `settings.base` -- see AvangardVPN and
    # AvangardTunnel below. This line stays as the statement of intent, and so
    # a new target does not silently inherit "1,2" with nothing to point at.
    TARGETED_DEVICE_FAMILY: "1"

# WireGuardKit — the tunnel engine. Wired in P3.
#
# ⚠️ This points at OUR FORK, not at WireGuard/wireguard-apple, and that is a
# workaround rather than a preference. Upstream's Package.swift declares
# `swift-tools-version:5.3` while using `.macOS(.v12)` / `.iOS(.v15)`, both of
# which need PackageDescription 5.5, so SwiftPM refuses the package outright:
#
#     /Package.swift:9:17: error: 'v12' is unavailable
#
# Upstream 901fe1cf (2023-02-14, "App: bump minimum OS versions") raised the
# platforms without raising the tools-version, and master has had no commit
# since 2023-02-15 — so the package has been unconsumable via SwiftPM that whole
# time. It goes unnoticed because the WireGuard app compiles these sources
# directly instead of resolving the package.
#
# The fork carries exactly TWO build fixes and nothing else — verified with
# `gh api .../compare/WireGuard:master...Stacopa-Avangard:master`, which reports
# 2 files, +2 -1:
#
#   Package.swift            5.3 -> 5.5      (the manifest above)
#   WireGuardKitC.h          +#include <sys/types.h>
#
# The second one is the same fix Mullvad carries on their production fork: the
# header uses u_int32_t / u_char / u_int16_t while including only key.h and
# x25519.h, which Xcode 26's explicit module builds reject. WireGuardKit is MIT,
# so both are permitted; re-run that compare before assuming anything else
# differs.
#
# ⚠️ This fork is frozen on upstream's February 2023 dependency set —
# wireguard-go from 2023-02-09 and golang.org/x/crypto v0.6.0, which is where
# ChaCha20-Poly1305 and Curve25519 live. No known advisory in that window
# touches WireGuard's usage (they are all in x/crypto's SSH package), but the
# gap is unmanaged. mullvad/wireguard-apple's `mullvad-master` runs
# wireguard-go 2023-12-11 and x/crypto v0.31.0 and is maintained into 2026;
# moving to it, or lifting those two pins into this fork, is tracked work and
# should happen before real users depend on this tunnel. It was not done in P3
# because Mullvad's branch also carries product divergence (multihop, DAITA,
# in-tunnel TCP, and a "Stop configuring tunnel settings" change that may move
# responsibility for network settings into the caller) and that needs an audit,
# not a swap.
#
# Keep the fork NAMED `wireguard-apple`. SwiftPM names its checkout directory
# after the repo, and the WireGuardGoBridge target below runs `make` inside
# .../SourcePackages/checkouts/wireguard-apple/Sources/WireGuardKitGo.
#
# Pinned by revision rather than by tag. Upstream tags read `1.0.16-27`, and
# SemVer treats everything after the hyphen as a PRE-RELEASE identifier, which
# SPM excludes from range requirements — so `from:` matches nothing and fails
# with a message about no matching versions, which reads like the package is
# gone rather than like the requirement is wrong.
packages:
  WireGuardKit:
    url: https://github.com/Stacopa-Avangard/wireguard-apple
    revision: 65774b04139bfdb3d81769e64b5adbd901a974ec

targets:
  # ── Main app ──────────────────────────────────────────────────────────────
  AvangardVPN:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # Shared with the tunnel extension, which is a separate process and so a
      # separate module — the only way both sides agree on the shape of the
      # config is to compile the same file. Both app targets need it because
      # TunnelConfig (in App/Sources) hands back a TunnelProfile.
      - path: Shared/Sources
      # Two things, both copied into the bundle rather than compiled:
      #
      #   Assets.xcassets — the app icon, the only asset catalog in the
      #   project. The 1024 PNG is rendered from the SAME brand vector the
      #   Android launcher icon uses — see Tools/render-app-icon.swift. Do not
      #   hand-edit the PNG; re-run that.
      #
      #   PrivacyInfo.xcprivacy — the privacy manifest, mandatory since May
      #   2024. XcodeGen has no rule for the .xcprivacy extension, so it takes
      #   the default for an unknown type and lands in Copy Bundle Resources,
      #   which is where Apple looks for it. Nothing else to wire up.
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        # The product name is one closed-up word, as in ExpressVPN or NordVPN.
        # It is also one character shorter than "Avangard VPN", which matters
        # on the Home Screen: iOS truncates the label on a single line at around
        # twelve characters and a space is a tempting place to break.
        CFBundleDisplayName: AvangardVPN
        # Pinned rather than left to actool, because on Xcode 26 actool does not
        # write it where App Store Connect looks. CI dumped the built plist: the
        # catalog compiles, AppIcon60x60@2x.png is emplaced, and the key appears
        # as CFBundleIcons > CFBundlePrimaryIcon > CFBundleIconName — with the
        # TOP LEVEL empty. ITMS-90713 is about the top-level key.
        #
        # Whether Apple's current validator still insists on it is not something
        # this repo can test without an upload, and one line costs nothing next
        # to a rejected build. The value must stay equal to
        # ASSETCATALOG_COMPILER_APPICON_NAME below.
        CFBundleIconName: AppIcon
        # ⚠️ Both of these must stay as build-setting references, not numbers.
        #
        # XcodeGen resolves CURRENT_PROJECT_VERSION and writes the RESULT into
        # the generated Info.plist as a literal. A literal in Info.plist beats
        # the build setting, so `xcodebuild CURRENT_PROJECT_VERSION=2` was
        # accepted, reported no error, and produced a build still stamped 1 —
        # which App Store Connect rejects as a duplicate build number.
        #
        # That is the bug `ios-release.yml` carries too: it passes
        # CURRENT_PROJECT_VERSION=${{ github.run_number }} and would have
        # shipped every build as number 1. It has never run, so nothing caught
        # it. The app and the extension must also agree — a mismatch fails the
        # upload — which is why the same two lines appear in both targets.
        #
        # Written as `$(…)` the value survives into the plist and Xcode expands
        # it at build time, so the command line finally wins.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Lets DEBUG builds reach a backend running on the dev machine over
        # plain HTTP (see AppConfig.baseURL). This only relaxes ATS for
        # local/loopback addresses — connections to the production origin are
        # still held to full ATS requirements.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # ⚠️ ITSAppUsesNonExemptEncryption is deliberately ABSENT, and the
        # answer it used to carry is still TRUE. Only the place it is declared
        # changed.
        #
        # It lived here so App Store Connect would stop asking per build. App
        # Store Connect rejects that:
        #
        #   ITMS-90592: Invalid Export Compliance Code. The export compliance
        #   key value [] in the app's Info.plist doesn't match the key value of
        #   the app's export compliance documentation.
        #
        # YES in the plist is a claim that documentation is already on file,
        # and Apple then wants ITSEncryptionExportComplianceCode alongside it.
        # That code only exists once App Encryption Documentation is filed in
        # App Store Connect -- which for this app is not filed, and per the
        # CCATS note below probably never needs to be. With no code to pair it
        # with, the key cannot stay.
        #
        # So the declaration moves to App Store Connect's questionnaire, where
        # the answer is the same: uses non-exempt encryption, qualifies for
        # exemption as industry-standard algorithms not provided by the OS. It
        # is asked once and can be applied to later builds.
        #
        # Everything below is why TRUE is the accurate answer. It has not
        # changed and is the reason not to reach for the easy NO. Getting it
        # wrong is a false declaration to a US government process, not a
        # checkbox.
        #
        # The exemption people reach for is "only uses encryption available in
        # the operating system". That fits an app whose crypto is HTTPS through
        # URLSession. It does not fit this one: wireguard-go carries its own
        # ChaCha20-Poly1305, Curve25519 and BLAKE2s, compiled into the extension
        # we embed. None of the other exemptions (authentication-only, DRM,
        # medical) come close either. A VPN is the textbook non-exempt case.
        #
        # ⚠️ It does not complete export compliance — but it commits us to
        # less than the first version of this comment claimed. Checked against
        # BIS and Apple on 2026-09-02:
        #
        #   - No ERN. BIS removed the encryption-registration requirement in its
        #     rule of 29 March 2021. There is nothing to register before
        #     exporting, and no SNAP-R account to open.
        #   - Probably no CCATS. Apple demands one only for PROPRIETARY
        #     algorithms no standards body accepts. Every primitive here is an
        #     IETF RFC — ChaCha20-Poly1305 (8439), Curve25519 (7748), BLAKE2s
        #     (7693) — which lands us in Apple's "industry standard algorithm,
        #     not provided within the Apple operating system" row instead.
        #   - France declaration only if the app is sold on the French App
        #     Store. An Indonesia-only release owes nothing here.
        #   - The annual ECCN 5D002 self-classification report under License
        #     Exception ENC §740.17(b)(1) is RETROSPECTIVE, not a precondition:
        #     due 1 February for the PREVIOUS calendar year, and not owed at all
        #     for a year with no exports. CSV, 12 columns, emailed to
        #     crypt-supp8@bis.doc.gov and enc@nsa.gov. (This line said
        #     crypt@bis.doc.gov until 2026-09-04; BIS's own page gives the
        #     -supp8 address, and a report sent elsewhere is a report not sent.)
        #     The whole picture, including why every other WireGuard VPN
        #     answers the opposite way, is in EXPORT-COMPLIANCE.md.
        #
        # So the only export step between this key and a release is App Store
        # Connect's own questionnaire. US EAR applies at all because the App
        # Store distributes from the US; an Indonesian developer account does
        # not change that.
        #
        # The CCATS row is the one judgement worth a professional opinion: if
        # anyone reads wireguard-go's protocol as proprietary rather than
        # standard, a CCATS is a BIS submission with a waiting period attached.
        # That is also the only path that would produce a compliance code, and
        # so the only thing that would let the key come back here.
    # ⚠️ The app carries the SAME networkextension entitlement as the extension
    # it embeds, and that is not a copy-paste slip. NETunnelProviderManager —
    # the API the app uses to save the VPN configuration and start the tunnel —
    # is gated on `packet-tunnel-provider` on the CALLING side too. Without it
    # `saveToPreferences` fails and the tunnel can never be started, even
    # though the extension itself is entitled correctly.
    #
    # It is specifically NOT `com.apple.developer.networking.vpn.api`
    # (`allow-vpn`, "Personal VPN"). That one is for NEVPNManager driving the
    # built-in IKEv2/IPsec stack, which this app does not use. Verified against
    # the reference implementation rather than reasoned about — upstream
    # wireguard-apple's Sources/WireGuardApp/UI/iOS/WireGuard.entitlements
    # carries networkextension + app-groups and no vpn.api key at all.
    #
    # Both are paid-only: a free Personal Team cannot sign either, which is why
    # AvangardVPNDeviceTest below has no entitlements block.
    entitlements:
      path: App/AvangardVPN.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.avangard.vpn
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avangard.vpn
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Repeated from the project-level settings on purpose; XcodeGen's own
        # target-level "1,2" wins otherwise. The reasoning is up there.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: AvangardTunnel
        embed: true

  # ── Tests ──────────────────────────────────────────────────────────────────
  # Integration tests that exercise the real API client against a backend run
  # locally (`pnpm dev` in Stacopa-Avangard/avangardvpn-server). They skip themselves
  # when AVANGARD_API_BASE is unset, so CI's unsigned compile-check is unaffected.
  AvangardVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AvangardVPNDeviceTest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avangard.vpn.tests
        # Signing a test bundle needs an Info.plist; let Xcode synthesise one
        # rather than checking in a file that carries no real configuration.
        GENERATE_INFOPLIST_FILE: "YES"

  # ── Device-test build (free Apple ID) + CI test host ───────────────────────
  # Same app sources, minus the two things a free "Personal Team" cannot sign:
  # the embedded tunnel extension (packet-tunnel-provider is paid-only) and the
  # App Groups entitlement (also paid-only). So it runs the real app UI on a
  # real iPhone with no paid account.
  #
  # ⚠️ P3 changed what this target is for. It used to be a convenience; now the
  # unit tests are hosted here too, because it is the only host that can run on
  # a Simulator at all — see the scheme block below. Deleting it would take the
  # test suite with it.
  #
  # It also stays a real signal: it shares App/Sources with production, so when
  # the app side finally wires up NETunnelProviderManager, this target is where
  # that first shows up as a build failure rather than as a failed install.
  #
  #   xcodegen generate && open AvangardVPN.xcodeproj
  #   → scheme "AvangardVPNDeviceTest" → your Personal Team → Run
  #
  # The bundle id differs from production ON PURPOSE. App IDs are globally
  # unique across Apple Developer accounts, so letting a personal team claim
  # `com.avangard.vpn` risks blocking the real account from registering it
  # later. A throwaway test build is not worth that.
  AvangardVPNDeviceTest:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # Shared with the tunnel extension, which is a separate process and so a
      # separate module — the only way both sides agree on the shape of the
      # config is to compile the same file. Both app targets need it because
      # TunnelConfig (in App/Sources) hands back a TunnelProfile.
      - path: Shared/Sources
      # Two things, both copied into the bundle rather than compiled:
      #
      #   Assets.xcassets — the app icon, the only asset catalog in the
      #   project. The 1024 PNG is rendered from the SAME brand vector the
      #   Android launcher icon uses — see Tools/render-app-icon.swift. Do not
      #   hand-edit the PNG; re-run that.
      #
      #   PrivacyInfo.xcprivacy — the privacy manifest, mandatory since May
      #   2024. XcodeGen has no rule for the .xcprivacy extension, so it takes
      #   the default for an unknown type and lands in Copy Bundle Resources,
      #   which is where Apple looks for it. Nothing else to wire up.
      - path: App/Resources
    info:
      path: App/DeviceTest-Info.plist
      properties:
        # Deliberately NOT "AvangardVPN Dev". The whole point of this target is
        # being unmistakable next to the real app on the same phone, and the
        # branded spelling truncates to "AvangardVPN…" on the Home Screen —
        # which is exactly the confusion this name exists to prevent.
        CFBundleDisplayName: Avangard Dev
        # Pinned rather than left to actool, because on Xcode 26 actool does not
        # write it where App Store Connect looks. CI dumped the built plist: the
        # catalog compiles, AppIcon60x60@2x.png is emplaced, and the key appears
        # as CFBundleIcons > CFBundlePrimaryIcon > CFBundleIconName — with the
        # TOP LEVEL empty. ITMS-90713 is about the top-level key.
        #
        # Whether Apple's current validator still insists on it is not something
        # this repo can test without an upload, and one line costs nothing next
        # to a rejected build. The value must stay equal to
        # ASSETCATALOG_COMPILER_APPICON_NAME below.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Lets a DEBUG build on-device talk to a backend running on the dev
        # machine over the LAN. Only relaxes ATS for local addresses.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # No ITSAppUsesNonExemptEncryption here, and that is not an oversight.
        # The key exists to answer App Store Connect; this target is a local
        # free-signed build that never reaches it. Adding it would imply the
        # export-compliance obligation applies to a build nobody distributes.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avangard.vpn.devtest
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Swift module keeps the production name even though the product
        # and bundle id do not. The tests say `@testable import AvangardVPN`,
        # and they are testing exactly these sources — this target compiles the
        # same App/Sources and Shared/Sources. Without this the import fails
        # with "Unable to resolve module dependency: 'AvangardVPN'".
        #
        # Renaming the import in the test files instead would have been the
        # wrong fix: it would tie the tests to a target that exists for build
        # reasons, when what they actually test is the app.
        PRODUCT_MODULE_NAME: AvangardVPN
    # The unit tests are hosted HERE, not in AvangardVPN, and that is a P3
    # consequence rather than a preference.
    #
    # A packet-tunnel Network Extension cannot run in the iOS Simulator at all,
    # and upstream's Makefile reflects that: it maps GOOS for `macosx` and
    # `iphoneos` and has no case for `iphonesimulator`, so a simulator build
    # silently produces a macOS libwg-go.a and the link fails on
    # _darwin_arm_init_mach_exception_handler. Hosting the tests in AvangardVPN
    # would drag the embedded extension — and therefore the Go bridge — into
    # every simulator test run.
    #
    # This target embeds no extension by design, so it is the one host that can
    # run on a simulator. The tests only touch App/Sources and Shared/Sources,
    # which it compiles identically.
    scheme:
      testTargets:
        - AvangardVPNTests
      # Forwarded into the test process. `$(VAR)` expands from build settings,
      # so `xcodebuild test AVANGARD_API_BASE=…` reaches the tests. (The
      # TEST_RUNNER_-prefix trick only works for UI-test runners, not for unit
      # tests hosted inside the app.)
      environmentVariables:
        AVANGARD_API_BASE: $(AVANGARD_API_BASE)
        AVANGARD_VERIFIED_SESSION_ID: $(AVANGARD_VERIFIED_SESSION_ID)
        AVANGARD_VERIFIED_SESSION_ID_2: $(AVANGARD_VERIFIED_SESSION_ID_2)
        AVANGARD_VERIFIED_SESSION_ID_3: $(AVANGARD_VERIFIED_SESSION_ID_3)

  # ── Packet Tunnel Provider (VPN runs here) ─────────────────────────────────
  AvangardTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel/Sources
      - path: Shared/Sources
      # The extension's OWN privacy manifest. Not a duplicate of the app's: the
      # manifest is per-bundle and Apple scans each binary separately, and this
      # is the binary that links libwg-go.a. See the file for what that costs.
      - path: Tunnel/Resources
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: AvangardVPN Tunnel
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/AvangardTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.avangard.vpn
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avangard.vpn.network-extension
        # See the app target: XcodeGen's target-level "1,2" beats the
        # project-level setting, so the extension has to say it too.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: WireGuardKit
      # Ordering, not just linkage: this makes `make` run before the extension
      # links, so libwg-go.a exists by then.
      - target: WireGuardGoBridge

  # ── wireguard-go bridge (external build target) ────────────────────────────
  # Not optional, and not something a build phase can replace. WireGuardKit's
  # own README says it plainly: "WireGuardKit links against wireguard-go-bridge
  # library, but it cannot build it automatically due to Swift package manager
  # limitations." SPM will happily resolve and compile the Swift half, then fail
  # at link time looking for -lwg-go. This target is what produces it.
  #
  # The working directory is inside the resolved SPM checkout, so it has to be
  # derived from a build setting rather than written as a path in this repo.
  #
  # ⚠️ It used to read `${BUILD_DIR%Build/*}...`, which is BASH suffix-stripping
  # syntax. Xcode build settings do not have it: `BUILD_DIR%Build/*` is simply
  # an unknown setting name, so it expanded to nothing and the target ran in the
  # project directory instead. The failure did not say so — it said
  # "unable to spawn process '/usr/bin/make' (No such file or directory)", which
  # reads like a missing tool. It is the missing WORKING DIRECTORY that produces
  # ENOENT on spawn; the tool path in that message is a red herring. A CI probe
  # confirmed /usr/bin/make was present the whole time.
  #
  # `$(BUILD_DIR)/../..` uses only plain `$(VAR)` and walks up from
  # <DerivedData>/Build/Products to <DerivedData>, which is where SourcePackages
  # lives. That holds for Xcode's own DerivedData and for CI's -derivedDataPath.
  #
  # ⛔ Needs Go **1.21** on the build machine — not "recent", not latest. An
  # earlier version of this comment said `brew install go`, which is the exact
  # wrong instruction: it installs the newest Go, and the Makefile here patches
  # the Go runtime with goruntime-boottime-over-monotonic.diff, written against
  # Go 1.17-1.21. That patch is what keeps WireGuard's handshake and keepalive
  # timers running while the phone sleeps. ios-build.yml pins go-version 1.21
  # for the same reason and explains it at length.
  #
  # Homebrew is not the way in: go@1.21 is a DISABLED formula, so the install is
  # refused rather than merely warned about. Use the official archive, which
  # go.dev keeps for every release that ever shipped:
  #
  #   curl -LO https://go.dev/dl/go1.21.13.darwin-arm64.tar.gz
  #   sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf go1.21.13.darwin-arm64.tar.gz
  #
  # ⚠️ Then make sure THIS target can see it. It spawns `/usr/bin/env make`, so
  # it resolves `go` from Xcode's build PATH, which is not your shell's and does
  # not necessarily include /usr/local/go/bin. If the build fails with
  # `go: command not found` at this target while `go version` works fine in a
  # terminal, that gap is the cause, not a missing install.
  #
  # Xcode does NOT bundle Go, and neither does the macOS CI runner — CI proved
  # that with `go: command not found` — so the workflow installs it with
  # actions/setup-go.
  #
  # An empty `type` is what marks a legacy target. XcodeGen has no `none` case
  # at all — `type: none` was a guess, and CI rejected the spec outright with
  # "Unknown Target type: none" before compiling a single file. The empty string
  # is the documented value (ProjectSpec.md lists it as `""` for legacy
  # targets); the `legacy:` block below is what makes it an Xcode External
  # Build System target.
  WireGuardGoBridge:
    type: ""
    platform: iOS
    legacy:
      # Delegated to a script because the checkout cannot be named by a fixed
      # path: BUILD_DIR moves between `build` and `archive`, so no single
      # `workingDirectory` expression reaches it in both, and the archive-side
      # miss surfaces as a misleading `unable to spawn process '/usr/bin/env'`.
      # The script's header has the two layouts and the reasoning.
      #
      # It resolves `make` from PATH rather than hardcoding /usr/bin/make (which
      # is what upstream's own project uses), so this still works on a Mac that
      # has Xcode without standalone Command Line Tools.
      #
      # `passSettings: true` is what hands BUILD_DIR and ACTION to the script.
      # `workingDirectory` is only a guaranteed-to-exist starting point — the
      # script cds to the checkout itself.
      toolPath: $(SRCROOT)/Scripts/build-wireguard-go.sh
      passSettings: true
      workingDirectory: $(SRCROOT)

# ── Schemes ────────────────────────────────────────────────────────────────
# AvangardVPNDeviceTest gets its scheme from its own `scheme:` block above,
# because that one carries the test action. This one exists purely so the app
# is buildable by name.
#
# It is not optional: `xcodebuild` refuses `-target` whenever
# `-derivedDataPath` is also given —
#
#   error: The flag -scheme, -testProductsPath, or -xctestrun is required
#          when specifying -derivedDataPath
#
# and CI pins -derivedDataPath so the SPM checkouts sit at a cacheable path.
schemes:
  AvangardVPN:
    build:
      targets:
        AvangardVPN: all
