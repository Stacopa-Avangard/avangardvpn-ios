name: Build iOS (unsigned)

# Compile-check on a macOS runner. Builds for the iOS Simulator with signing
# disabled, so it validates the code WITHOUT an Apple Developer account. Device
# builds / TestFlight (signed) come later once signing (fastlane match) is set up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 ships Xcode 16, which reads the current XcodeGen project format (77).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode + show version
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator, unsigned)
        run: |
          xcodebuild build \
            -project AvangardVPN.xcodeproj \
            -scheme AvangardVPN \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
